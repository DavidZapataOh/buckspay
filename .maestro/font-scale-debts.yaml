# Captures the debt screens at the device's current font scale and theme; run with `-e THEME=light` or `-e THEME=dark`.
appId: xyz.buckspay.app
---
- openLink: buckspay://debts
- extendedWaitUntil:
    visible:
      id: debts
    timeout: 20000
- takeScreenshot: debts-list-${THEME}
- tapOn: New debt
- extendedWaitUntil:
    visible:
      id: debts-friend-hint
    timeout: 10000
- takeScreenshot: debts-friend-${THEME}
- back
- openLink: buckspay://debts/accept
- extendedWaitUntil:
    visible:
      id: debts-exchange
    timeout: 20000
- takeScreenshot: debts-accept-wait-${THEME}
