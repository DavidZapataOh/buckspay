# Fresh install of a localnet build with a gateway: a wallet that never held a lamport activates this
# phone for free, holding only the funding token it locks. The Add funds step says Buckspay pays the
# network costs and that there is no fee, fakewallet signs without sending, and the gateway pays.
# Needs the validator, the gateway configured with the faucet's token (`scripts/usdc-faucet.mjs`).
appId: xyz.buckspay.app
env:
  RPC_URL: http://localhost:8899
  FAUCET_URL: http://localhost:8898
---
- clearState
- stopApp: com.solana.mobilewalletadapter.fakewallet
- launchApp
- extendedWaitUntil:
    visible:
      id: setup-payments
    timeout: 60000
- tapOn:
    id: setup-payments
- extendedWaitUntil:
    visible:
      id: onboarding-connect
    timeout: 20000
- tapOn:
    id: onboarding-next
- extendedWaitUntil:
    visible: AUTHORIZE
    timeout: 20000
- tapOn: AUTHORIZE
- extendedWaitUntil:
    visible:
      id: onboarding-activate
    timeout: 30000
- assertVisible: Buckspay pays the network costs. Your wallet pays nothing else.
- assertVisible: There is no fee.
- assertNotVisible: .*Add SOL.*
- copyTextFrom:
    id: wallet-address
- runScript: scripts/fund-usdc.js
- runScript: scripts/balance.js
- assertTrue: ${output.balance == 0}
- scrollUntilVisible:
    element:
      id: onboarding-next
- tapOn:
    id: onboarding-next
- extendedWaitUntil:
    visible: SIGN TRANSACTION.*
    timeout: 20000
- tapOn: AUTHORIZE
- extendedWaitUntil:
    visible:
      id: device-ready
    timeout: 60000
- assertVisible: This phone is registered to your wallet
- runScript: scripts/balance.js
- assertTrue: ${output.balance == 0}
