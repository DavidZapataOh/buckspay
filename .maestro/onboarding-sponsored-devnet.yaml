# Fresh install of a devnet build with the deployed gateway and the Mock MWA Wallet with a dev key
# that holds at least 5 devnet USDC and no SOL. The Add funds step says Buckspay pays the network
# costs; the Mock MWA Wallet answers sign_transactions with its own signature alone where the
# message requires two, so the app refuses the answer, sends nothing, and says the wallet changed
# the transaction, with nothing to pay the network itself with.
appId: xyz.buckspay.app
env:
  RPC_URL: https://api.devnet.solana.com
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: setup-payments
    timeout: 60000
- tapOn:
    id: setup-payments
- extendedWaitUntil:
    visible:
      id: onboarding-connect
    timeout: 20000
- tapOn:
    id: onboarding-next
- extendedWaitUntil:
    visible:
      id: com.solana.mwallet:id/btn_connect
    timeout: 20000
- tapOn:
    id: com.solana.mwallet:id/btn_connect
- extendedWaitUntil:
    visible:
      id: onboarding-activate
    timeout: 30000
- assertVisible: Buckspay pays the network costs. Your wallet pays nothing else.
- assertNotVisible: .*Add SOL.*
- copyTextFrom:
    id: wallet-address
- runScript: scripts/balance.js
- assertTrue: ${output.balance == 0}
- scrollUntilVisible:
    element:
      id: onboarding-next
- tapOn:
    id: onboarding-next
- tapOn:
    id: com.solana.mwallet:id/btn_connect
    optional: true
- extendedWaitUntil:
    visible:
      id: com.solana.mwallet:id/btn_approve
    timeout: 20000
- tapOn:
    id: com.solana.mwallet:id/btn_approve
- extendedWaitUntil:
    visible: .*Your wallet changed the transaction, so Buckspay could not cover its network cost.*
    timeout: 30000
- assertVisible: .*Nothing was sent and nothing was charged. Open Buckspay in Phantom or Solflare, or add about 0.005 SOL to activate with your own wallet.*
- assertNotVisible: Buckspay pays the network costs. Your wallet pays nothing else.
- assertNotVisible:
    id: device-ready
- runScript: scripts/balance.js
- assertTrue: ${output.balance == 0}
