# Fresh install of a devnet build with the Mock MWA Wallet (a dev key in its local.properties that
# holds SOL and at least 5 devnet USDC): set up payments, connect and activate this phone against
# the deployed program: its registration and first lock in one transaction paid by the wallet.
appId: xyz.buckspay.app
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: setup-payments
    timeout: 60000
- tapOn:
    id: setup-payments
- extendedWaitUntil:
    visible:
      id: onboarding-connect
    timeout: 20000
- tapOn:
    id: onboarding-next
- extendedWaitUntil:
    visible:
      id: com.solana.mwallet:id/btn_connect
    timeout: 20000
- tapOn:
    id: com.solana.mwallet:id/btn_connect
- extendedWaitUntil:
    visible:
      id: onboarding-activate
    timeout: 30000
- scrollUntilVisible:
    element:
      id: onboarding-next
- tapOn:
    id: onboarding-next
- tapOn:
    id: com.solana.mwallet:id/btn_connect
    optional: true
- extendedWaitUntil:
    visible:
      id: com.solana.mwallet:id/btn_approve
    timeout: 20000
- tapOn:
    id: com.solana.mwallet:id/btn_approve
- extendedWaitUntil:
    visible:
      id: device-ready
    timeout: 90000
