# Switches between the five tabs by their labels 20 times.
appId: xyz.buckspay.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: home
    timeout: 60000
- repeat:
    times: 20
    commands:
      - tapOn: Pay
      - assertVisible:
          id: pay
      - tapOn: Receive
      - assertVisible:
          id: receive
      - tapOn: Activity
      - assertVisible:
          id: activity
      - tapOn: Settings
      - assertVisible:
          id: settings
      - tapOn: Home
      - assertVisible:
          id: home
