# Fresh install of a localnet build with the Solana Mobile fakewallet: the app opens without
# onboarding; setting up payments connects and creates the device key in one step, shows what
# registering costs and that it is public and permanent, and registers the key. The app is killed
# after the first step to check that onboarding resumes where it stopped.
appId: xyz.buckspay.app
env:
  RPC_URL: http://localhost:8899
---
- clearState
- stopApp: com.solana.mobilewalletadapter.fakewallet
- launchApp
- extendedWaitUntil:
    visible:
      id: setup-payments
    timeout: 60000
- assertNotVisible: AUTHORIZE
- tapOn:
    id: setup-payments
- extendedWaitUntil:
    visible:
      id: onboarding-connect
    timeout: 20000
- assertVisible: Step 1 of 2
- tapOn:
    id: onboarding-next
- extendedWaitUntil:
    visible: AUTHORIZE
    timeout: 20000
- tapOn: AUTHORIZE
- extendedWaitUntil:
    visible:
      id: onboarding-register
    timeout: 30000
- assertVisible: Step 2 of 2
- assertVisible: .*publicly and permanently.*
- assertVisible: Costs about 0.0016 SOL from your wallet. Not refundable.
- assertVisible: Your wallet has 0 SOL. Add SOL to it before you register.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: setup-payments
    timeout: 30000
- tapOn:
    id: setup-payments
- extendedWaitUntil:
    visible:
      id: onboarding-register
    timeout: 20000
- copyTextFrom:
    id: wallet-address
- runScript: scripts/airdrop.js
- scrollUntilVisible:
    element:
      id: onboarding-next
- tapOn:
    id: onboarding-next
- extendedWaitUntil:
    visible: AUTHORIZE
    timeout: 20000
- tapOn: AUTHORIZE
- extendedWaitUntil:
    visible: SEND TRANSACTION TO CLUSTER
    timeout: 20000
- tapOn: SEND TRANSACTION TO CLUSTER
- extendedWaitUntil:
    visible:
      id: device-ready
    timeout: 60000
- assertVisible: This phone is registered to your wallet
