plugins {
  id "com.android.library"
  id "expo-module-gradle-plugin"
}

group = "xyz.buckspay.prover"
version = "0.1.0"

android {
  namespace = "xyz.buckspay.prover"
  defaultConfig {
    versionCode = 1
    versionName = "0.1.0"
    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
  }
}

// The proving library is built from the Go module, for the 64-bit ABIs the app is built for.
def proverAbis = (findProperty("reactNativeArchitectures") ?: "arm64-v8a").split(",").findAll { it in ["arm64-v8a", "x86_64"] }
def proverRoot = file("../../../prover")

tasks.register("buildProverLibrary", Exec) {
  inputs.files(fileTree(proverRoot) { include "**/*.go", "go.mod", "go.sum", "mobile/build-android.sh"; exclude "**/*_test.go" })
  inputs.property("abis", proverAbis)
  outputs.dir("src/main/jniLibs")
  commandLine([new File(proverRoot, "mobile/build-android.sh").path] + proverAbis)
}

tasks.matching { it.name ==~ /merge.*JniLibFolders/ }.configureEach { dependsOn "buildProverLibrary" }

// The netting fixtures of the instrumented tests come from the shared vectors file, never by hand.
def nettingAssets = layout.buildDirectory.dir("generated/nettingAssets")
tasks.register("generateNettingAssets") {
  def vectors = file("../../../prover/netting/testdata/vectors.json")
  inputs.file(vectors)
  outputs.dir(nettingAssets)
  doLast {
    def hex = { String h -> (0..<h.length().intdiv(2)).collect { Integer.parseInt(h.substring(it * 2, it * 2 + 2), 16) as byte } as byte[] }
    def c = new groovy.json.JsonSlurper().parse(vectors).cases.find { it.name == "n8" }
    def dir = new File(nettingAssets.get().asFile, "netting")
    dir.mkdirs()
    new File(dir, "w8.bin").bytes = hex(c.witness)
    def publics = new ByteArrayOutputStream()
    c.public.each { publics.write(hex(it)) }
    new File(dir, "public8.bin").bytes = publics.toByteArray()
  }
}
android.sourceSets.androidTest.assets.srcDir(nettingAssets)
tasks.matching { it.name ==~ /merge.*AndroidTestAssets/ }.configureEach { dependsOn "generateNettingAssets" }

dependencies {
  implementation "androidx.work:work-runtime-ktx:2.11.2"
  implementation "androidx.work:work-multiprocess:2.11.2"
  testImplementation "junit:junit:4.13.2"
  androidTestImplementation "androidx.test:runner:1.7.0"
  androidTestImplementation "androidx.test.ext:junit:1.3.0"
}
