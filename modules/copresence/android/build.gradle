plugins {
  id "com.android.library"
  id "expo-module-gradle-plugin"
}

group = "xyz.buckspay.copresence"
version = "0.1.0"

android {
  namespace = "xyz.buckspay.copresence"
  ndkVersion = rootProject.ext.ndkVersion
  defaultConfig {
    versionCode = 1
    versionName = "0.1.0"
    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
      }
    }
    def architectures = rootProject.findProperty("reactNativeArchitectures")
    if (architectures) {
      ndk { abiFilters(*architectures.split(",")) }
    }
  }
  externalNativeBuild {
    cmake {
      path = file("src/main/cpp/CMakeLists.txt")
      version = "3.22.1"
    }
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
  androidTestImplementation "androidx.test:runner:1.7.0"
  androidTestImplementation "androidx.test.ext:junit:1.3.0"
}
