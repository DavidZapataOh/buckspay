[package]
name = "buckspay-client"
version = "0.1.0"
description = "Rust client of the Buckspay program, generated by Codama from its IDL"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
fetch = ["dep:solana-rpc-client"]

[dependencies]
borsh = "1.5.7"
num-derive = "0.4.2"
num-traits = "0.2.19"
solana-account = "4.5.0"
solana-account-info = "3.1.0"
solana-address = { version = "2.8.0", features = ["borsh", "copy", "curve25519", "decode"] }
solana-cpi = "3.1.0"
solana-instruction = "3.5.1"
solana-program-error = "3.0.0"
solana-rpc-client = { version = "4.3.0", default-features = false, optional = true }
thiserror = "2.0.17"
