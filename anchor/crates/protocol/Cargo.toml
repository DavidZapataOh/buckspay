[package]
name = "buckspay-protocol"
version = "0.1.0"
description = "Buckspay offline note format"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
verify = ["dep:p256", "dep:ed25519-dalek", "dep:curve25519-dalek"]
short-windows = []

[dependencies]
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"], optional = true }
ed25519-dalek = { version = "2.2.0", default-features = false, optional = true }
curve25519-dalek = { version = "4.1.3", default-features = false, optional = true }

[dev-dependencies]
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
ed25519-dalek = { version = "2.2.0", default-features = false }
proptest = "1"
sha2 = { version = "0.10.9", default-features = false }
serde_json = "1"
solana-hash = { version = "4.0.0", features = ["decode"] }

[[example]]
name = "vectors"
required-features = ["verify"]
