[package]
name = "zk-vectors"
version = "0.1.0"
edition = "2021"
description = "Generates the cross-language test vectors for the per-message validity circuit from the protocol crate"
publish = false

[dependencies]
buckspay-protocol = { path = "../../crates/protocol", features = ["verify"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
