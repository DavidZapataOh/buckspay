name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner --verbose .

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Install ktlint
        run: |
          curl -sSfLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          echo "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75  ktlint" | sha256sum -c -
          chmod +x ktlint
          mkdir -p "$HOME/.local/bin" && mv ktlint "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm run ci

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm exec expo prebuild -p android --clean
      - run: ./gradlew :hardware-keys:testDebugUnitTest :hardware-keys:assembleDebugAndroidTest
        working-directory: android
      - name: Enable KVM
        run: |
          echo KERNEL==kvm, GROUP=kvm, MODE=0666, OPTIONS+=static_node=kvm | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          working-directory: android
          script: ./gradlew :hardware-keys:connectedDebugAndroidTest

  program:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anchor
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: 4.3.0
          anchor_version: 1.2.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: anchor
      - run: cargo fmt --check
      - run: anchor build -- --features devnet
      - run: cargo clippy --all-targets --features buckspay/devnet -- -D warnings
      - run: cargo test --features buckspay/devnet
      - run: cargo test -p buckspay-protocol --features verify
      - run: cargo clippy -p buckspay-protocol --all-targets --features verify -- -D warnings
      - run: cargo build-sbf --manifest-path crates/protocol/Cargo.toml --arch v3 --tools-version v1.57
      - run: pnpm codama:check
        working-directory: .

  expo-sdk:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm exec expo install --check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: 4.3.0
          anchor_version: 1.2.0
      - run: rustup toolchain install
        working-directory: anchor
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: anchor
      - run: anchor build -- --features devnet
        working-directory: anchor
      - name: Start a local validator with the program
        run: |
          solana-test-validator --reset --quiet --ledger "$RUNNER_TEMP/ledger" \
            --bpf-program "$(jq -r .address anchor/target/idl/buckspay.json)" anchor/target/deploy/buckspay.so &
          until solana cluster-version -u localhost; do sleep 1; done
      # A localnet test build: the bundle talks to the validator forwarded to the emulator's localhost.
      - run: pnpm exec expo prebuild -p android --clean
        env:
          EXPO_PUBLIC_NETWORK: localnet
      - run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64
        working-directory: android
        env:
          EXPO_PUBLIC_NETWORK: localnet
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | MAESTRO_VERSION=2.11.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo KERNEL==kvm, GROUP=kvm, MODE=0666, OPTIONS+=static_node=kvm | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            pnpm dlx solana-mobile@0.5.0 device install fakewallet
            adb reverse tcp:8899 tcp:8899
            maestro test .maestro/onboarding-localnet.yaml
            maestro test .maestro/restart.yaml
            adb shell cmd connectivity airplane-mode enable
            adb reverse --remove tcp:8899
            maestro test .maestro/offline.yaml
            adb shell cmd connectivity airplane-mode disable
            adb reverse tcp:8899 tcp:8899
            maestro test .maestro/revoked.yaml
            maestro test .maestro/confirming.yaml
